name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - run: chmod +x gradlew && ./gradlew assembleDebug

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - run: chmod +x gradlew && ./gradlew lint

  unit-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest

  # Instrumentation tests require hardware-accelerated emulation.
  # GitHub Actions runners lack KVM (Linux) and HVF (macOS), making emulator
  # tests impractically slow or impossible. Add this back when using Firebase
  # Test Lab, a self-hosted runner with nested virtualization, or real devices.
  #
  # instrumentation-test:
  #   needs: build
  #   runs-on: ubuntu-latest
  #   steps: ...
