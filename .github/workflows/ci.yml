name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - run: chmod +x gradlew && ./gradlew assembleDebug

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - run: chmod +x gradlew && ./gradlew lint

  unit-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest

  instrumentation-test:
    needs: build
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          force-avd-creation: true
          emulator-options: -no-window -noaudio -no-boot-anim -timezone GMT -memory 2048 -cores 2 -gpu host
          disable-animations: true
          emulator-boot-timeout: 300
          script: ./gradlew connectedDebugAndroidTest
      - name: Debug emulator on failure
        if: failure()
        run: |
          echo "=== ADB Devices ==="
          adb devices -l
          echo "=== Emulator Logcat ==="
          adb logcat -d -t 200
          echo "=== Gradle Test Report ==="
          find . -path "*/reports/*" -name "*.html" | head -10
