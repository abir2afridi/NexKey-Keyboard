name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew lint

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest

  instrumentation-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -noaudio -no-boot-anim -timezone GMT -memory 2048 -cores 2
          disable-animations: true
          boot-timeout: 300000
          script: chmod +x gradlew && ./gradlew connectedDebugAndroidTest
      - name: Debug emulator on failure
        if: failure()
        run: |
          echo "=== ADB Devices ==="
          adb devices -l
          echo "=== Emulator Logcat ==="
          adb logcat -d -t 200
          echo "=== Gradle Test Report ==="
          find . -path "*/reports/*" -name "*.html" | head -10
