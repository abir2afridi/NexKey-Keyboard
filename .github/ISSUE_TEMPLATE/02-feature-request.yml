name: "💡 Feature Request"
description: "✨ Suggest an idea or improvement for NexKey Keyboard"
title: "[FEATURE]: "
labels: [feature-request]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Thanks for suggesting an improvement to **NexKey Keyboard**!

        💬 Share your idea and tell us why it would be valuable.
        🔍 We review every feature request carefully.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: "✅ Prerequisites"
      options:
        - label: "🔍 I have searched existing issues and feature requests"
          required: true
        - label: "📖 I have checked the roadmap in the README"
          required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: "💥 Problem Statement"
      description: What problem does this solve? What are you currently unable to do?
      placeholder: "I wish I could..."
    validations:
      required: true

  - type: textarea
    id: current-limitation
    attributes:
      label: "🚧 Current Limitation"
      description: Describe the limitation or workaround you currently use
      placeholder: "Currently I have to..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "🔍 Proposed Solution"
      description: Describe the feature you'd like to see
      placeholder: "It would be great if NexKey could..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "🔄 Alternative Solutions"
      description: Have you considered any alternatives?
    validations:
      required: false

  - type: dropdown
    id: user-value
    attributes:
      label: "💯 User / Business Value"
      options:
        - "🎱 Nice to have"
        - "💪 Useful for my workflow"
        - "⛔ Blocks my use case"
        - "🤝 Would make me recommend this project"
        - "🎯 Critical for adoption"
    validations:
      required: true

  - type: dropdown
    id: who-benefits
    attributes:
      label: "👥 Who Benefits"
      options:
        - "🌍 All users"
        - "🇧🇩 Bangla typists"
        - "🇸🇦 Arabic typists"
        - "💻 Developers / power users"
        - "♿ Accessibility users"
        - "🏭 Enterprise / organizational users"
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: "🎨 Mockups / References"
      description: Links to similar features in other keyboards, screenshots, or design ideas
      placeholder: "e.g., Gboard does this by..."
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: "💡 Additional Context"
      description: Any other information that might help
    validations:
      required: false

  - type: checkboxes
    id: coc
    attributes:
      label: "🤝 Code of Conduct"
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
